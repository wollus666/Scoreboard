<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Palinka United – Dart Anzeige</title>
<style>
    :root {
        --primary: #1c1b33;
        --secondary: #8a2be2;
        --accent: #c0c0c0;
        --text: #ffffff;
    }

    body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at center, #2f1f55, #1c1b33 70%);
        font-family: "Arial", sans-serif;
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    /* Logo */
    .logo {
        width: 40vw;
        max-width: 380px;
        margin-top: 2vh;
        filter: drop-shadow(0 0 12px rgba(0,0,0,0.4));
    }

    /* Scoreboard */
    .scoreboard {
        margin-top: 4vh;
        width: 90%;
        max-width: 900px;
        display: flex;
        justify-content: space-between;
        padding: 20px;
        background: rgba(0,0,0,0.25);
        border-radius: 20px;
        backdrop-filter: blur(8px);
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .team {
        flex: 1;
        text-align: center;
    }

    .team-name {
        font-size: 5vw;
        max-font-size: 60px;
        margin-bottom: 10px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    .score {
        font-size: 14vw;
        max-font-size: 150px;
        font-weight: bold;
        margin-top: 5px;
        text-shadow: 0 0 12px rgba(0,0,0,0.7);
    }

    /* Status / Winner */
    #status {
        margin-top: 4vh;
        font-size: 4vw;
        max-font-size: 40px;
        font-weight: bold;
        text-align: center;
    }
</style>
</head>
<body>

<img src="logo.png" class="logo" alt="Palinka United Logo" />

<div class="scoreboard">
    <div class="team">
        <div class="team-name" id="name-home">Heim</div>
        <div class="score" id="score-home">0</div>
    </div>

    <div class="team">
        <div class="team-name" id="name-guest">Gast</div>
        <div class="score" id="score-guest">0</div>
    </div>
</div>

<div id="status"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-database.js";

  const firebaseConfig = {
  apiKey: "AIzaSyARQ_bVlWn01IcHwwYPzkmirpMV2J-0JuQ",
  authDomain: "palinka-scoreboard.firebaseapp.com",
  databaseURL: "https://palinka-scoreboard-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "palinka-scoreboard",
  storageBucket: "palinka-scoreboard.firebasestorage.app",
  messagingSenderId: "164854231094",
  appId: "1:164854231094:web:daaca6f0f31c6f64d8e897"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const gameRef = ref(db, "dartGame");

  onValue(gameRef, snapshot => {
    const data = snapshot.val();
    if (!data) return;
    document.getElementById("name-home").textContent = data.homeName ?? "Heim";
    document.getElementById("name-guest").textContent = data.guestName ?? "Gast";
    document.getElementById("score-home").textContent = data.home ?? 0;
    document.getElementById("score-guest").textContent = data.guest ?? 0;

    const total = (data.home ?? 0) + (data.guest ?? 0);
    const statusEl = document.getElementById("status");

    if (total >= 18) {
      if ((data.home ?? 0) > (data.guest ?? 0)) {
        statusEl.textContent = `Gewinner: ${data.homeName} ${data.home}:${data.guest}`;
      } else if ((data.guest ?? 0) > (data.home ?? 0)) {
        statusEl.textContent = `Gewinner: ${data.guestName} ${data.home}:${data.guest}`;
      } else {
        statusEl.textContent = `Sudden Death! Stand: ${data.home}:${data.guest}`;
      }
    } else if ((data.home ?? 0) === 9 && (data.guest ?? 0) === 9) {
      statusEl.textContent = `Sudden Death – 9 : 9`;
    } else {
      statusEl.textContent = "";
    }
  });
</script>


</body>
</html>
