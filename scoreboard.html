<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dart Scoreboard</title>
<style>
  :root { --bg1:#FFFFFF; --bg2:#8a2be2; --text:#000; }
  html,body { height:100%; margin:0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(to bottom right, var(--bg1), var(--bg2));
    color: var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:24px;
    box-sizing:border-box;
    position:relative;
    overflow:hidden;
  }

  .welcome-text { text-align:center; margin-bottom:18px; user-select:none; }
  .welcome-text .line1 { font-size:3.2rem; font-weight:700; margin-bottom:6px; }
  .welcome-text .line2 { font-size:2.2rem; }

  .scoreboard {
    width:92%;
    max-width:1500px;
    display:flex;
    justify-content:space-around;
    align-items:center;
  }

  .team {
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:200px;
  }

  .team-name { font-size:2.4rem; margin-bottom:18px; }
  .counter { font-size:5.2rem; margin:30px 0; font-weight:700; }

  #status { margin-top:22px; font-size:1.8rem; font-weight:700; }

  .logo-container {
    position:absolute;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
  }
  .logo-container img { width:700px; height:auto; display:block; }

  @media (max-width:600px) {
    .welcome-text .line1 { font-size:2rem; }
    .welcome-text .line2 { font-size:1.4rem; }
    .team-name { font-size:1.8rem; }
    .counter { font-size:3.6rem; }
    .logo-container img { width:700px; }
  }
</style>
</head>
<body>

<div class="welcome-text">
  <div class="line1">Herzlichen Willkommen</div>
  <div class="line2">Palinka United</div>
</div>

<div class="scoreboard">
  <div class="team">
    <div class="team-name" id="name-home">Heim</div>
    <div class="counter" id="score-home">0</div>
  </div>

  <div class="team">
    <div class="team-name" id="name-guest">Gast</div>
    <div class="counter" id="score-guest">0</div>
  </div>
</div>

<div id="status"></div>

<div class="logo-container"><img src="logo.png" alt="Logo"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-database.js";

  const firebaseConfig = {
  apiKey: "AIzaSyARQ_bVlWn01IcHwwYPzkmirpMV2J-0JuQ",
  authDomain: "palinka-scoreboard.firebaseapp.com",
  databaseURL: "https://palinka-scoreboard-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "palinka-scoreboard",
  storageBucket: "palinka-scoreboard.firebasestorage.app",
  messagingSenderId: "164854231094",
  appId: "1:164854231094:web:daaca6f0f31c6f64d8e897"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const gameRef = ref(db, "dartGame");

  onValue(gameRef, snapshot => {
    const data = snapshot.val();
    if (!data) return;
    document.getElementById("name-home").textContent = data.homeName ?? "Heim";
    document.getElementById("name-guest").textContent = data.guestName ?? "Gast";
    document.getElementById("score-home").textContent = data.home ?? 0;
    document.getElementById("score-guest").textContent = data.guest ?? 0;

    const total = (data.home ?? 0) + (data.guest ?? 0);
    const statusEl = document.getElementById("status");

    if (total >= 18) {
      if ((data.home ?? 0) > (data.guest ?? 0)) {
        statusEl.textContent = `Gewinner: ${data.homeName} ${data.home}:${data.guest}`;
      } else if ((data.guest ?? 0) > (data.home ?? 0)) {
        statusEl.textContent = `Gewinner: ${data.guestName} ${data.home}:${data.guest}`;
      } else {
        statusEl.textContent = `Sudden Death! Stand: ${data.home}:${data.guest}`;
      }
    } else if ((data.home ?? 0) === 9 && (data.guest ?? 0) === 9) {
      statusEl.textContent = `Sudden Death – 9 : 9`;
    } else {
      statusEl.textContent = "";
    }
  });
</script>

</body>
</html>
